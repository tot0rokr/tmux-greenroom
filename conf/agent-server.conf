# Loaded once, when the agent server starts. See docs/design.md (D5).

# Marks this server, so llm-agent.tmux does nothing if a config loads it here.
set -g @llm_agent_server 1

set -g detach-on-destroy on

# The client of this server is a popup; let colors, Shift+Enter and OSC 52
# pass through to the host server.
set -as terminal-features ',tmux*:RGB:extkeys:clipboard,screen*:RGB:extkeys:clipboard'

set -g status-style default
set -g status-left-length 40
set -g status-left '#[reverse] #S #[default] '
set -g status-right-length 80
set -g status-right '#[dim]#{prefix} #{@llm_agent_key} hide  #{prefix} #{@llm_agent_new_key} new  #{prefix} #{@llm_agent_menu_key} workspaces '
set -wg window-status-format ' #I:#W#{?window_bell_flag,!,} '
set -wg window-status-current-format ' #I:#W '
set -wg window-status-current-style reverse
set -wg window-status-bell-style bold

# High slots, so hooks in @llm-agent-config at the default slot 0 do not
# replace them. attach.sh adds the alert hooks at 101.
set-hook -g 'client-attached[100]' "set-option -gF @llm_agent_last '#{session_name}'"
set-hook -g 'client-session-changed[100]' "set-option -gF @llm_agent_last '#{session_name}'"
set-hook -g 'session-renamed[100]' "set-option -gF @llm_agent_last '#{session_name}'"
