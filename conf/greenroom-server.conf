# Loaded once, when the greenroom server starts. See docs/design.md (D5).

# Marks this server, so greenroom.tmux does nothing if a config loads it here.
set -g @greenroom_server 1

set -g detach-on-destroy on

# The client of this server is a popup; let colors, Shift+Enter and OSC 52
# pass through to the host server.
set -as terminal-features ',tmux*:RGB:extkeys:clipboard,screen*:RGB:extkeys:clipboard'

set -g status-style default
set -g status-left-length 40
set -g status-left '#[reverse] #S #[default] '
set -g status-right-length 80
# Short, so a narrow popup keeps its window list; the command menu has the rest.
set -g status-right '#[dim]#{prefix} #{@greenroom_key} hide #{?#{!=:#{@greenroom_commands_key},}, #{prefix} #{@greenroom_commands_key} menu ,}'
set -wg window-status-format ' #I:#W#{?window_bell_flag,!,} '
set -wg window-status-current-format ' #I:#W '
set -wg window-status-current-style reverse
set -wg window-status-bell-style bold

# High slots, so hooks in @greenroom-config at the default slot 0 do not
# replace them. attach.sh adds the alert hooks at 101.
set-hook -g 'client-attached[100]' "set-option -gF @greenroom_last '#{session_name}'"
set-hook -g 'client-session-changed[100]' "set-option -gF @greenroom_last '#{session_name}'"
set-hook -g 'session-renamed[100]' "set-option -gF @greenroom_last '#{session_name}'"
